name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Chercher le projet Android
        run: |
          echo "Contenu du depot :"
          ls -la
          find . -maxdepth 4 \( -name gradlew -o -name build.gradle -o -name build.gradle.kts \) -print

      - name: Compiler APK debug
        working-directory: "MBL-3"
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Publier le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: application-android
          path: |
            MBL-3/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
