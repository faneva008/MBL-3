name: Sync published Supabase content

on:
  workflow_dispatch:
  schedule:
    # GitHub's shortest supported schedule interval is five minutes.
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: supabase-content-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate the published-content signature
        env:
          SUPABASE_URL: https://fekcmhwberumklgdqshf.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_js5AqdCWk9CvJWDoWeWPzw_GNFgzfrH
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --get "$SUPABASE_URL/rest/v1/mbl_website_public_texts" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            --data-urlencode "select=catalog_id,updated_at,last_amended_at" \
            --data-urlencode "order=catalog_id.asc" \
            --data-urlencode "limit=1000" \
            -o /tmp/mbl-content.json
          python3 - <<'PY'
          import hashlib
          import json
          with open('/tmp/mbl-content.json', encoding='utf-8') as handle:
              rows = json.load(handle)
          canonical = json.dumps(rows, sort_keys=True, separators=(',', ':')).encode()
          digest = hashlib.sha256(canonical).hexdigest()
          with open('web/.content-sync-state', 'w', encoding='utf-8') as handle:
              handle.write(digest + '\n')
          print(f'Published content signature: {digest[:12]}…')
          PY

      - name: Trigger Vercel only when content changed
        run: |
          set -euo pipefail
          if git diff --quiet -- web/.content-sync-state; then
            echo 'No published Supabase content change detected.'
            exit 0
          fi
          git config user.name 'MBL Content Sync'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/.content-sync-state
          git commit -m 'chore: sync site with Supabase content'
          git push origin HEAD:main
